<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <title>Sign in | Marvel Splendor</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0, viewport-fit=cover" />
  <meta name="theme-color" content="#070b2a" />
  <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
      }

      /* The game's night sky. Laid out for a phone held sideways: logo left, sign-in right. */
      body {
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 56px;
        padding: 16px max(24px, env(safe-area-inset-right)) 16px max(24px, env(safe-area-inset-left));
        box-sizing: border-box;
        color: #fff;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        background-color: #070b2a;
        background-image:
          radial-gradient(1px 1px at 20px 30px, #fff, transparent),
          radial-gradient(1px 1px at 90px 140px, rgb(255 255 255 / 0.8), transparent),
          radial-gradient(1.5px 1.5px at 160px 60px, #fff, transparent),
          radial-gradient(1.5px 1.5px at 260px 210px, rgb(255 230 200 / 0.9), transparent),
          radial-gradient(35% 45% at 18% 25%, rgb(168 85 247 / 0.45), transparent 70%),
          radial-gradient(40% 50% at 85% 85%, rgb(56 130 255 / 0.4), transparent 70%),
          linear-gradient(160deg, #0d1445, #070b2a);
        background-size: 200px 200px, 200px 200px, 200px 200px, 340px 340px, auto, auto, auto;
        background-attachment: fixed;
      }

      .intro {
        flex: 0 1 320px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        text-align: center;
      }

      /* Thanos, in a gold ring, over the name. Stored at twice the size it is drawn, so it stays sharp. */
      .icon {
        width: 84px;
        height: 84px;
        border-radius: 50%;
        object-fit: cover;
        box-shadow: 0 0 0 3px #f6c945;
      }

      .logo {
        display: flex;
        flex-direction: column;
        align-items: center;
        line-height: 1;
        font-size: 52px;
      }
      .logo-name {
        font-family: Georgia, "Times New Roman", serif;
        font-weight: 700;
        font-style: italic;
        background: linear-gradient(180deg, #fff0a8, #f6c945 45%, #b57f14);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .logo-marvel {
        margin-top: 0.15em;
        padding: 0.05em 0.3em;
        background: #ed1d24;
        font-size: 0.55em;
        font-weight: 900;
        letter-spacing: -0.05em;
      }
      .blurb {
        margin: 0;
        font-size: 14px;
        line-height: 1.5;
        color: #a9b4ff;
      }

      #lock {
        flex: none;
      }

      /* Lock's own look, kept plain. It ships strong defaults, hence !important. */
      .auth0-lock.auth0-lock .auth0-lock-center {
        padding: 0 !important;
      }
      .auth0-lock.auth0-lock .auth0-lock-widget {
        width: 320px !important;
        border-radius: 16px !important;
        overflow: hidden auto !important;
        /* Never taller than the screen, however the phone is held: the form scrolls inside. */
        max-height: calc(100vh - 32px) !important;
        max-height: calc(100dvh - 32px) !important;
        box-shadow: 0 0 0 2px #f6c945, 0 12px 40px rgb(0 0 0 / 0.5) !important;
      }
      /* The page already carries the logo, and the height is needed for the form. */
      .auth0-lock.auth0-lock .auth0-lock-header {
        display: none !important;
      }
      /* Dark lettering, so the gold button can be read. */
      .auth0-lock.auth0-lock .auth0-lock-submit,
      .auth0-lock.auth0-lock .auth0-lock-submit .auth0-label-submit {
        color: #070b2a !important;
        font-weight: 700;
      }
      .auth0-lock.auth0-lock .auth0-lock-submit svg,
      .auth0-lock.auth0-lock .auth0-lock-submit svg * {
        stroke: #070b2a !important;
        fill: #070b2a !important;
      }

      /* A phone held sideways is short: everything a size down, so the form fits without scrolling. */
      @media (max-height: 480px) {
        body {
          gap: 32px;
          padding-top: 8px;
          padding-bottom: 8px;
        }
        .icon {
          width: 60px;
          height: 60px;
        }
        .logo {
          font-size: 40px;
        }
        .blurb {
          font-size: 12px;
        }
        #lock {
          zoom: 0.8;
        }
      }

      /* Held upright, or a narrow window: the logo sits above the form. */
      @media (max-width: 640px) {
        body {
          flex-direction: column;
          gap: 20px;
        }
        .intro {
          flex: none;
        }
        .blurb {
          display: none;
        }
      }
    </style>
</head>

  <script src="https://cdn.auth0.com/js/lock/14.2.3/lock.min.js"></script>
  <script>
    // Decode utf8 characters properly
    var config = JSON.parse(decodeURIComponent(escape(window.atob('@@config@@'))));
    config.extraParams = config.extraParams || {};
    var connection = config.connection;
    var prompt = config.prompt;
    // Always the game's name, whatever the application is called in Auth0.
    var languageDictionary = { title: 'Marvel Splendor' };
    var language;

    if (typeof config.dict === 'string') {
      language = config.dict;
    }
    var loginHint = config.extraParams.login_hint;

    // Available Lock configuration options: https://auth0.com/docs/libraries/lock/lock-configuration
    var lock = new Auth0Lock(config.clientID, config.auth0Domain, {
      // Drawn in the page beside the logo, not as a pop-up over it.
      container: 'lock',
      auth: {
        redirectUrl: config.callbackURL,
        responseType: (config.internalOptions || {}).response_type ||
          (config.callbackOnLocationHash ? 'token' : 'code'),
        params: config.internalOptions
      },
      configurationBaseUrl: config.clientConfigurationBaseUrl,
      overrides: {
        __tenant: config.auth0Tenant,
        __token_issuer: config.authorizationServer.issuer
      },
      assetsUrl:  config.assetsUrl,
      allowedConnections: connection ? [connection] : null,
      rememberLastLogin: !prompt,
      language: language,
      languageBaseUrl: config.languageBaseUrl,
      languageDictionary: languageDictionary,
      theme: {
        primaryColor:    '#f6c945'
      },
      prefill: loginHint ? { email: loginHint, username: loginHint } : null,
      closable: false,
      defaultADUsernameFromEmailPrefix: false
    });

    lock.show();
  </script>
